    <!-- Pre-paint theme bootstrap. The theme preference now defaults to
         "system", so without this a visitor on a dark OS gets served the
         prerendered light HTML and sees it flip once React hydrates. Inline and
         synchronous on purpose: it must run before first paint. Mirrors the
         resolution order in src/hooks/useTheme.ts. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('theme');
          if (pref !== 'light' && pref !== 'dark') pref = 'system';
          var dark = pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) { /* private mode: fall through to the light default */ }
      })();
    </script>

    <!-- Fonts are self-hosted via @fontsource-variable (bundled in Vite build).
         No external font requests — zero CDN roundtrips, zero FOUT. -->

    <!-- Speculation Rules: prerender same-origin pages when the user shows
         intent (hovers ~200ms / pointerdown). Chrome loads the target's
         prerendered HTML + boots it in a hidden tab, so the click is
         near-instant. Same-origin only; no-op in non-supporting browsers.
         https://developer.chrome.com/docs/web-platform/prerender-pages -->
    <script type="speculationrules">
      {
        "prerender": [
          {
            "where": {
              "and": [
                { "href_matches": "/*" },
                { "not": { "selector_matches": "[rel~=external], [target=_blank]" } }
              ]
            },
            "eagerness": "moderate"
          }
        ]
      }
    </script>
