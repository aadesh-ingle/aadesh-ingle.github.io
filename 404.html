    <!-- Pre-paint theme bootstrap. The site defaults to light; this applies a

         Mirrors the resolution order in src/hooks/useTheme.ts: the
         'theme-pref' key, then an explicit light/dark under the legacy
         'theme' key, then light. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('theme-pref');
          if (pref !== 'light' && pref !== 'dark' && pref !== 'system') {
            var legacy = localStorage.getItem('theme');
            pref = legacy === 'dark' ? 'dark' : 'light';
          }
          var dark = pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) { /* private mode: fall through to the light default */ }
      })();
    </script>

          navigator.serviceWorker.ready.then((registration) => {
            const urls = performance
              .getEntriesByType("resource")
              .map((entry) => entry.name)
              .filter((name) => name.indexOf(location.origin + "/assets/") === 0);
            if (urls.length && registration.active) {
              registration.active.postMessage({ type: "cache-loaded-assets", urls: urls });
            }
          });
        });
